<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Particle Flow - Core Avoidance</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #666; 
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">Drag to rotate the object</div>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.5;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // --- POST-PROCESSING (BLOOM) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.5, 0.1);

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);


        // --- SHARED MATERIAL BASE ---
        const particleMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.15,
            transparent: true,
            opacity: 0.35, 
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });


        // --- OBJECT 1: CENTRAL SPHERE (GOLDEN, FINE, LOW INTENSITY) ---
        const sphereGeo = new THREE.SphereGeometry(2.5, 32, 32);
        const sphereMat = particleMaterial.clone();
        sphereMat.color.setHex(0xffaa00); 
        sphereMat.size = 0.04; 
        sphereMat.opacity = 0.35; 
        
        const centralSphere = new THREE.Points(sphereGeo, sphereMat);
        scene.add(centralSphere);


        // --- OBJECT 2: THE MAIN FLOWING ARCS (WHITE) ---
        const arcParticleCount = 14000; // Slight bump in count for smoother streams
        const arcGeo = new THREE.BufferGeometry();
        const arcPositions = new Float32Array(arcParticleCount * 3);
        const arcOffsets = new Float32Array(arcParticleCount * 3);

        for (let i = 0; i < arcParticleCount; i++) {
            arcPositions[i * 3] = 0;
            arcPositions[i * 3 + 1] = 0;
            arcPositions[i * 3 + 2] = 0;

            arcOffsets[i * 3] = (Math.random() - 0.5);
            arcOffsets[i * 3 + 1] = (Math.random() - 0.5);
            arcOffsets[i * 3 + 2] = Math.random();
        }

        arcGeo.setAttribute('position', new THREE.BufferAttribute(arcPositions, 3));
        const arcSystem = new THREE.Points(arcGeo, particleMaterial);
        scene.add(arcSystem);


        // --- OBJECT 3: THE OUTER CLOUD (FAINTER WHITE) ---
        const cloudParticleCount = 5000;
        const cloudGeo = new THREE.BufferGeometry();
        const cloudPositions = new Float32Array(cloudParticleCount * 3);

        for (let i = 0; i < cloudParticleCount; i++) {
            const radius = 15 + Math.random() * 15;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            cloudPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            cloudPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta) * 0.5;
            cloudPositions[i * 3 + 2] = radius * Math.cos(phi);
        }
        cloudGeo.setAttribute('position', new THREE.BufferAttribute(cloudPositions, 3));
        
        const cloudMat = particleMaterial.clone();
        cloudMat.size = 0.1;
        cloudMat.opacity = 0.15; 
        const outerCloud = new THREE.Points(cloudGeo, cloudMat);
        scene.add(outerCloud);


        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            controls.update();

            // --- Animate the Main Arcs ---
            const positions = arcSystem.geometry.attributes.position.array;
            
            for (let i = 0; i < arcParticleCount; i++) {
                const i3 = i * 3;
                const idxRatio = i / arcParticleCount; 
                
                const t = time * 0.5 * (1 + arcOffsets[i3 + 2] * 0.2); 
                
                let flowProgress = (idxRatio + t * 0.1) % 1;
                let angle = (flowProgress * Math.PI * 2) - Math.PI;

                // --- THE MATH SHAPING THE CURVES ---
                
                // 1. Base Radius (Horizontal spread)
                // We stretch it out a bit more on X to make the "Eye" wider
                const baseRadius = 10 + Math.cos(angle) * 12;

                // 2. Tube Thickness
                const tubeThickness = 1.0 + Math.abs(Math.sin(angle)) * 2.5;

                // 3. Split top and bottom
                const mirrorSide = (i % 2 === 0) ? 1 : -1;
                const swirlAngle = t * 2 + idxRatio * Math.PI * 4;
                
                let tx = Math.sin(angle) * baseRadius;
                
                // Tube rotation
                let ty = Math.cos(swirlAngle) * tubeThickness * mirrorSide;
                let tz = Math.sin(swirlAngle) * tubeThickness;

                // --- KEY MODIFICATION: Vertical Separation ---
                // using Math.cos(angle * 0.5) creates a hump that is:
                // 1.0 at center (angle=0)
                // 0.0 at ends (angle=PI)
                // Multiplied by mirrorSide, it pushes UP for evens, DOWN for odds.
                // Multiplied by 5.5 to ensure it clears the 2.5 radius sphere with space.
                ty += Math.cos(angle * 0.5) * 5.5 * mirrorSide; 

                // Add small randomness
                tx += arcOffsets[i3] * 0.5;
                ty += arcOffsets[i3 + 1] * 0.5;
                tz += arcOffsets[i3 + 2] * 0.5;

                positions[i3] = tx;
                positions[i3 + 1] = ty;
                positions[i3 + 2] = tz;
            }
            arcSystem.geometry.attributes.position.needsUpdate = true;


            // --- Animate Outer Cloud ---
            outerCloud.rotation.y = time * 0.05;
            outerCloud.rotation.z = time * 0.02;

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
