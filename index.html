<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing 3D Particle Arcs</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // 1. Environment Setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02); // Adds depth

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 15;
    camera.position.y = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio); // Sharpness on retina screens
    renderer.toneMapping = THREE.ReinhardToneMapping; // Better light blending
    document.body.appendChild(renderer.domElement);

    // 2. Central Core
    const coreGeometry = new THREE.SphereGeometry(1.5, 32, 32);
    const coreMaterial = new THREE.MeshBasicMaterial({ 
        color: 0x00ffff, // Cyan core
    });
    const core = new THREE.Mesh(coreGeometry, coreMaterial);
    scene.add(core);

    // 3. Particle System with Mirrored Arcs
    const particleCount = 15000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const initialPositions = new Float32Array(particleCount * 3); // To store base state
    const phases = new Float32Array(particleCount); // Random offset for animation
    const speeds = new Float32Array(particleCount); // Individual speeds

    const color = new THREE.Color();
    const colors = [];

    for (let i = 0; i < particleCount; i++) {
        // Distribute particles randomly in a spherical area initially
        // We will override these in the animation loop, but this initializes arrays
        let x = (Math.random() - 0.5) * 10;
        let y = (Math.random() - 0.5) * 10;
        let z = (Math.random() - 0.5) * 10;

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        // Store initial random parameters
        phases[i] = Math.random() * Math.PI * 2;
        speeds[i] = 0.5 + Math.random() * 0.5;

        // Color Logic: Mix of Cyan and Blue-Purple
        if (Math.random() > 0.5) {
            color.setHex(0x00ffff); // Cyan
        } else {
            color.setHex(0x5500ff); // Purple/Blue
        }
        colors.push(color.r, color.g, color.b);
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.15,
        vertexColors: true, // Allow individual particle colors
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending, // Makes overlapping particles brighter
        depthWrite: false // Essential for transparent glowing particles
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    // 4. Interaction (OrbitControls)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // 5. Post-Processing (UnrealBloom)
    const renderScene = new RenderPass(scene, camera);

    const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        1.5, 0.4, 0.85
    );
    bloomPass.threshold = 0.1;
    bloomPass.strength = 1.2; // Intensity of the glow
    bloomPass.radius = 0.5;   // Spread of the glow

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // 6. Animation Logic
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const time = clock.getElapsedTime();
        const positions = particles.geometry.attributes.position.array;

        // Calculate Particle Flow
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            const phase = phases[i];
            const speed = speeds[i];

            // Create a "Toroidal" flow logic
            // We create 2 mirrored groups based on if index is even or odd
            const isMirror = i % 2 === 0 ? 1 : -1; 
            
            // t represents the particle's progress along the curve
            const t = (time * speed * 0.2) + phase;

            // Radius varies to create the "arc" shape (wider in middle, narrower at poles)
            // Using sin(t) creates a loop, wrapping it gives the orbit
            const tubeRadius = 6 + Math.sin(t * 3) * 2; // Dynamic width
            
            // Core Math for Mirrored Arcs
            const angle = t * isMirror; // Rotate clockwise or counter-clockwise
            
            // Position Calculation
            const x = Math.cos(angle) * tubeRadius;
            const z = Math.sin(angle) * tubeRadius;
            
            // The Y position oscillates but twists with the angle
            // Math.sin(t * 2) * 4 creates the vertical wave height
            // isMirror * 2 adds a slight vertical offset between the streams
            const y = Math.sin(t * 4 + (isMirror * Math.PI)) * 4; 

            // Apply to buffer
            positions[i3] = x;
            positions[i3 + 1] = y;
            positions[i3 + 2] = z;
        }

        // IMPORTANT: Flag the geometry as updated so GPU receives new positions
        particles.geometry.attributes.position.needsUpdate = true;
        
        // Pulse the Core
        const coreScale = 1 + Math.sin(time * 2) * 0.1;
        core.scale.set(coreScale, coreScale, coreScale);

        controls.update();
        composer.render(); // Render via Composer (Bloom), not standard renderer
    }

    // Handle Window Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>

</body>
</html>
